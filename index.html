<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4TYS9XPXTN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4TYS9XPXTN');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NU Universal CGPA Calculator | Calculate National University GPA</title>
    <meta name="description" content="Calculate your National University (NU) CGPA instantly with our universal credits and grades based calculator. Fast, dynamic, and mobile-friendly tool for all NU departments.">
    <meta name="keywords" content="NU CGPA Calculator, National University CGPA, Universal GPA Calculator, NU Result Calculator, Credit Grade Calculator">
    <meta name="author" content="Md. Ridwan Ahmed Akib">
    <meta name="robots" content="index, follow">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .calculator-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .table-header {
            display: flex;
            gap: 8px;
            padding: 0 5px 8px 5px;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 13px;
            border-bottom: 2px solid #eef2f3;
            margin-bottom: 12px;
        }
        .header-subject { width: 75px; }
        .header-credit { flex: 1; }
        .header-grade { flex: 1.2; }
        .header-action { width: 35px; text-align: center; }

        .subject-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #eef2f3;
            box-sizing: border-box;
        }
        .subject-row:focus-within {
            border-color: #3498db;
        }
        .subject-label {
            font-weight: bold;
            width: 75px;
            color: #34495e;
            font-size: 13px;
            white-space: nowrap;
        }
        select {
            flex: 1;
            padding: 8px 5px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            outline: none;
            background-color: #fff;
            font-size: 13px;
            transition: 0.2s;
            min-width: 0; /* Prevents select from overflowing on small screens */
        }
        .grade-select {
            flex: 1.2; /* Gives slightly more space to grade text */
        }
        select:focus {
            border-color: #3498db;
        }
        .btn-add {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-add:hover { background-color: #2980b9; }
        
        .btn-calc {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-calc:hover { background-color: #27ae60; }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 5px;
            border-radius: 6px;
            cursor: pointer;
            width: 35px;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-delete:hover { background-color: #c0392b; }

        .result-box {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .result-success {
            color: #2c3e50;
            background: #e8f8f5;
            border: 1px solid #2ecc71;
        }
        .result-fail {
            color: #c0392b;
            background: #fdebd0;
            border: 1px solid #e74c3c;
        }

        .footer-credit {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
            font-weight: 500;
            border-top: 1px solid #eef2f3;
            padding-top: 12px;
        }

        /* Responsive adjustments for super clean one-line view on mobile */
        @media (max-width: 480px) {
            .calculator-card {
                padding: 15px 10px;
            }
            .table-header {
                font-size: 11px;
                padding: 0 2px 5px 2px;
            }
            .header-subject { width: 55px; }
            .header-action { width: 28px; }
            
            .subject-row {
                padding: 6px 4px;
                gap: 4px;
            }
            .subject-label {
                width: 55px;
                font-size: 11px;
            }
            select {
                padding: 6px 2px;
                font-size: 11px;
                border-radius: 4px;
            }
            .btn-delete {
                width: 28px;
                padding: 6px 0;
                font-size: 11px;
                border-radius: 4px;
            }
            h2 { font-size: 18px; }
            .subtitle { font-size: 12px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>All Department CGPA Calculator</h2>
    <div class="subtitle">Enter your credits and grades to calculate CGPA</div>
    
    <div class="table-header">
        <div class="header-subject">Subject</div>
        <div class="header-credit">Credits</div>
        <div class="header-grade">Grade</div>
        <div class="header-action">Del</div>
    </div>

    <div id="subjects-container">
        <div class="subject-row" id="row-1">
            <span class="subject-label">Sub 1</span>
            <select class="credit-select">
                <option value="4">4 Cr</option>
                <option value="3">3 Cr</option>
                <option value="2">2 Cr</option>
                <option value="1">1 Cr</option>
            </select>
            <select class="grade-select">
                <option value="4.00">A+ (4.00)</option>
                <option value="3.75">A (3.75)</option>
                <option value="3.50">A- (3.50)</option>
                <option value="3.25">B+ (3.25)</option>
                <option value="3.00">B (3.00)</option>
                <option value="2.75">B- (2.75)</option>
                <option value="2.50">C+ (2.50)</option>
                <option value="2.25">C (2.25)</option>
                <option value="2.00">D (2.00)</option>
                <option value="0.00">F (0.00)</option>
            </select>
            <button class="btn-delete" onclick="deleteRow('row-1')">X</button>
        </div>

        <div class="subject-row" id="row-2">
            <span class="subject-label">Sub 2</span>
            <select class="credit-select">
                <option value="4">4 Cr</option>
                <option value="3">3 Cr</option>
                <option value="2">2 Cr</option>
                <option value="1">1 Cr</option>
            </select>
            <select class="grade-select">
                <option value="4.00">A+ (4.00)</option>
                <option value="3.75">A (3.75)</option>
                <option value="3.50">A- (3.50)</option>
                <option value="3.25">B+ (3.25)</option>
                <option value="3.00">B (3.00)</option>
                <option value="2.75">B- (2.75)</option>
                <option value="2.50">C+ (2.50)</option>
                <option value="2.25">C (2.25)</option>
                <option value="2.00">D (2.00)</option>
                <option value="0.00">F (0.00)</option>
            </select>
            <button class="btn-delete" onclick="deleteRow('row-2')">X</button>
        </div>
    </div>

    <button class="btn-add" onclick="addSubjectRow()">+ Add Subject</button>
    <button class="btn-calc" onclick="calculateCGPA()">Calculate CGPA</button>

    <div class="result-box" id="result-display"></div>

    <div class="footer-credit">
        Developed by Md. Ridwan Ahmed Akib
    </div>
</div>

<script>
    let subjectCount = 2;

    function addSubjectRow() {
        subjectCount++;
        const container = document.getElementById('subjects-container');
        const rowId = `row-${subjectCount}`;
        
        const rowHTML = `
            <div class="subject-row" id="${rowId}">
                <span class="subject-label">Sub ${subjectCount}</span>
                <select class="credit-select">
                    <option value="4">4 Cr</option>
                    <option value="3">3 Cr</option>
                    <option value="2">2 Cr</option>
                    <option value="1">1 Cr</option>
                </select>
                <select class="grade-select">
                    <option value="4.00">A+ (4.00)</option>
                    <option value="3.75">A (3.75)</option>
                    <option value="3.50">A- (3.50)</option>
                    <option value="3.25">B+ (3.25)</option>
                    <option value="3.00">B (3.00)</option>
                    <option value="2.75">B- (2.75)</option>
                    <option value="2.50">C+ (2.50)</option>
                    <option value="2.25">C (2.25)</option>
                    <option value="2.00">D (2.00)</option>
                    <option value="0.00">F (0.00)</option>
                </select>
                <button class="btn-delete" onclick="deleteRow('${rowId}')">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
        updateLabels();
    }

    function deleteRow(id) {
        const row = document.getElementById(id);
        if(row) {
            row.remove();
            updateLabels();
        }
    }

    function updateLabels() {
        const rows = document.querySelectorAll('.subject-row');
        subjectCount = rows.length;
        rows.forEach((row, index) => {
            row.querySelector('.subject-label').innerText = `Sub ${index + 1}`;
        });
    }

    function calculateCGPA() {
        const credits = document.querySelectorAll('.credit-select');
        const grades = document.querySelectorAll('.grade-select');
        
        let totalCredits = 0;
        let totalEarnedPoints = 0;
        let failCount = 0;

        if(credits.length === 0) {
            alert("Please add at least one subject!");
            return;
        }

        for (let i = 0; i < credits.length; i++) {
            let credit = parseFloat(credits[i].value);
            let gradePoint = parseFloat(grades[i].value);

            if (gradePoint === 0.00) {
                failCount++;
            }

            totalCredits += credit;
            totalEarnedPoints += (credit * gradePoint);
        }

        const resultDisplay = document.getElementById('result-display');
        resultDisplay.style.display = 'block';
        
        if (failCount > 0) {
            resultDisplay.className = 'result-box result-fail';
            if (failCount === 1) {
                resultDisplay.innerHTML = `Failed! You are failed in 1 subject.`;
            } else {
                resultDisplay.innerHTML = `Failed! You are failed in ${failCount} subjects.`;
            }
        } else {
            let finalCGPA = totalEarnedPoints / totalCredits;
            resultDisplay.className = 'result-box result-success';
            resultDisplay.innerText = `Your CGPA: ${finalCGPA.toFixed(2)}`;
        }
    }
</script>

</body>
</html>
